basePath: /api/admin
definitions:
  model.AdminUpdateEmployeeRequest:
    properties:
      restaurantId:
        type: string
      role:
        $ref: '#/definitions/model.Role'
    required:
    - restaurantId
    - role
    type: object
  model.AuthInitResponse:
    properties:
      codeRequestId:
        type: string
    type: object
  model.CityResponse:
    properties:
      averageSalary:
        type: number
      country:
        type: string
      countryCode:
        type: string
      id:
        type: string
      name:
        type: string
      salaryCoefficient:
        type: number
      utcOffset:
        type: integer
    type: object
  model.CreateEmployeeInvitationRequest:
    properties:
      email:
        type: string
      fullName:
        maxLength: 100
        minLength: 2
        type: string
      restaurantId:
        type: string
      role:
        enum:
        - admin
        - employee
        - owner
        type: string
    required:
    - email
    - fullName
    - restaurantId
    - role
    type: object
  model.CreateReservationRequest:
    properties:
      duration:
        description: 'Format: "2:30" (2 hours 30 minutes)'
        type: string
      fullName:
        maxLength: 100
        minLength: 2
        type: string
      guestCount:
        maximum: 20
        minimum: 1
        type: integer
      phone:
        type: string
      startAt:
        type: string
      tableId:
        type: string
      userNotes:
        maxLength: 500
        type: string
    required:
    - duration
    - fullName
    - startAt
    - tableId
    type: object
  model.CreateRestaurantRequest:
    properties:
      address:
        maxLength: 200
        minLength: 5
        type: string
      cityId:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        type: string
    required:
    - address
    - cityId
    - name
    - phone
    type: object
  model.CreateRoomRequest:
    properties:
      closedDates:
        items:
          type: string
        type: array
      isEnabled:
        type: boolean
      name:
        maxLength: 100
        minLength: 1
        type: string
      regularSchedule:
        $ref: '#/definitions/model.WeekSchedule'
      specialDateSchedules:
        items:
          $ref: '#/definitions/model.SpecialDateSchedule'
        type: array
    required:
    - name
    type: object
  model.CreateSubURLRequest:
    properties:
      key:
        maxLength: 50
        minLength: 1
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - key
    - name
    type: object
  model.DayAvailability:
    properties:
      date:
        description: YYYY-MM-DD format
        type: string
      isActive:
        description: Whether bookings are available on this day
        type: boolean
      weekday:
        description: '"Monday", "Tuesday", etc.'
        type: string
    type: object
  model.Element:
    properties:
      code:
        $ref: '#/definitions/model.ElementCode'
      fontSize:
        type: integer
      height:
        type: integer
      id:
        type: string
      index:
        description: Z-order on the map
        type: integer
      isEnabled:
        type: boolean
      roomId:
        type: string
      rotation:
        type: integer
      seats:
        items:
          $ref: '#/definitions/model.Element'
        type: array
      tableIndex:
        description: Table identifier/name (for table elements)
        type: integer
      text:
        type: string
      type:
        $ref: '#/definitions/model.ElementType'
      width:
        type: integer
      x:
        type: number
      "y":
        type: number
    type: object
  model.ElementCode:
    enum:
    - WINDOW
    - WALL
    - ROUNDED_WALL
    - POLYGONAL_WALL
    - CHAIR
    - ARMCHAIR_1
    - ARMCHAIR_2
    - SQUARE_TABLE
    - ROUNDED_TABLE
    - TEXT
    - ARROW
    - CHAIR_SLOT
    - ACTIVE_CHAIR_SLOT
    - SOURCE
    - SOFA_LEFT_ARM_LONG
    - SOFA_LEFT_ARM_SHORT
    - SOFA_LEFT_NO_ARM
    - SOFA_SEMI_LEFT_ARM_LONG
    - SOFA_SEMI_LEFT_ARM_SHORT
    - SOFA_SEMI_LEFT_NO_ARM
    - SOFA_RIGHT_ARM_LONG
    - SOFA_RIGHT_ARM_SHORT
    - SOFA_RIGHT_NO_ARM
    - SOFA_SEMI_RIGHT_ARM_LONG
    - SOFA_SEMI_RIGHT_ARM_SHORT
    - SOFA_SEMI_RIGHT_NO_ARM
    - SOFA_RIGHT_CONNECTOR
    - SOFA_MIDDLE_CONNECTOR
    - SOFA_LEFT_CONNECTOR
    type: string
    x-enum-varnames:
    - ElementCodeWindow
    - ElementCodeWall
    - ElementCodeRoundedWall
    - ElementCodePolygonalWall
    - ElementCodeChair
    - ElementCodeArmchair1
    - ElementCodeArmchair2
    - ElementCodeSquareTable
    - ElementCodeRoundedTable
    - ElementCodeText
    - ElementCodeArrow
    - ElementCodeChairSlot
    - ElementCodeActiveChairSlot
    - ElementCodeSource
    - ElementCodeSofaLeftArmLong
    - ElementCodeSofaLeftArmShort
    - ElementCodeSofaLeftNoArm
    - ElementCodeSofaSemiLeftArmLong
    - ElementCodeSofaSemiLeftArmShort
    - ElementCodeSofaSemiLeftNoArm
    - ElementCodeSofaRightArmLong
    - ElementCodeSofaRightArmShort
    - ElementCodeSofaRightNoArm
    - ElementCodeSofaSemiRightArmLong
    - ElementCodeSofaSemiRightArmShort
    - ElementCodeSofaSemiRightNoArm
    - ElementCodeSofaRightConnector
    - ElementCodeSofaMiddleConnector
    - ElementCodeSofaLeftConnector
  model.ElementType:
    enum:
    - TABLE
    - SEAT
    - WALL
    - TEXT
    - ARROW
    type: string
    x-enum-varnames:
    - ElementTypeTable
    - ElementTypeSeat
    - ElementTypeWall
    - ElementTypeText
    - ElementTypeArrow
  model.EmailUpdateRequest:
    properties:
      newEmail:
        type: string
    required:
    - newEmail
    type: object
  model.EmailUpdateResponse:
    properties:
      codeRequestId:
        type: string
    type: object
  model.EmailVerifyRequest:
    properties:
      code:
        type: string
      codeRequestId:
        type: string
    required:
    - code
    - codeRequestId
    type: object
  model.Employee:
    properties:
      createdAt:
        type: string
      email:
        type: string
      fullName:
        type: string
      id:
        type: string
      restaurants:
        items:
          $ref: '#/definitions/model.EmployeeRestaurant'
        type: array
      tgChatId:
        type: integer
      tgId:
        type: integer
      tgIsBot:
        type: boolean
      tgIsPremium:
        type: boolean
      tgLang:
        type: string
      tgUsername:
        type: string
      updatedAt:
        type: string
    type: object
  model.EmployeeRestaurant:
    properties:
      restaurantId:
        type: string
      role:
        $ref: '#/definitions/model.Role'
    type: object
  model.ErrorDetail:
    properties:
      code:
        example: ERR_001
        type: string
      isShow:
        example: false
        type: boolean
      message:
        example: Error message
        type: string
    type: object
  model.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/model.ErrorDetail'
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  model.MarkReservationsAsSeenRequest:
    properties:
      markAllUnseen:
        type: boolean
      reservationIds:
        items:
          type: string
        type: array
    type: object
  model.PendingAuthResponse:
    properties:
      accessToken:
        type: string
      isPending:
        type: boolean
    type: object
  model.PendingInvitation:
    properties:
      createdAt:
        example: "2023-01-01T00:00:00Z"
        type: string
      email:
        example: john.doe@example.com
        type: string
      expiresAt:
        example: "2023-01-02T00:00:00Z"
        type: string
      fullName:
        example: John Doe
        type: string
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      restaurantId:
        type: string
      role:
        example: admin
        type: string
      status:
        example: pending
        type: string
    type: object
  model.PersonalCabinetUpdateRequest:
    properties:
      fullName:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  model.RegisterRequest:
    properties:
      email:
        type: string
      fullName:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - email
    - fullName
    type: object
  model.ReservationCountsResponse:
    properties:
      pendingCount:
        type: integer
      unseenCount:
        type: integer
    type: object
  model.ReservationResponse:
    properties:
      code:
        type: string
      createdAt:
        type: string
      durationMinutes:
        type: integer
      email:
        type: string
      endAt:
        type: string
      fullName:
        type: string
      guestCount:
        type: integer
      id:
        type: string
      isActive:
        type: boolean
      phone:
        type: string
      restaurantId:
        type: string
      roomId:
        type: string
      startAt:
        type: string
      status:
        $ref: '#/definitions/model.Status'
      tableId:
        type: string
      timeSlot:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
      userNotes:
        type: string
    type: object
  model.ReservationSlot:
    properties:
      endAt:
        type: string
      roomId:
        type: string
      startAt:
        type: string
      tableId:
        type: string
    type: object
  model.Restaurant:
    properties:
      address:
        type: string
      city:
        type: string
      createdAt:
        type: string
      defaultRoomId:
        type: string
      description:
        type: string
      email:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      isClosedForAllRooms:
        type: boolean
      isDefaultScheduleForAllRooms:
        type: boolean
      isSpecialScheduleForAllRooms:
        type: boolean
      name:
        type: string
      phone:
        type: string
      rooms:
        items:
          $ref: '#/definitions/model.Room'
        type: array
      settings:
        $ref: '#/definitions/model.Settings'
      subUrls:
        items:
          $ref: '#/definitions/model.SubURL'
        type: array
      updatedAt:
        type: string
      urlName:
        type: string
      utcOffset:
        type: integer
    type: object
  model.RestaurantAvailability:
    properties:
      address:
        type: string
      city:
        type: string
      id:
        type: string
      name:
        type: string
      selectedDate:
        description: YYYY-MM-DD format
        type: string
      showDates:
        description: Available booking dates
        items:
          $ref: '#/definitions/model.DayAvailability'
        type: array
      slotsByTableId:
        additionalProperties:
          items:
            $ref: '#/definitions/model.ReservationSlot'
          type: array
        description: Available slots per table
        type: object
      startTimeToMaxDurationMap:
        additionalProperties:
          items:
            type: string
          type: array
        description: Time slots → available durations
        type: object
    type: object
  model.RestaurantSummary:
    properties:
      address:
        type: string
      city:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      phone:
        type: string
      urlName:
        type: string
      utcOffset:
        type: integer
    type: object
  model.Role:
    enum:
    - owner
    - admin
    - employee
    type: string
    x-enum-varnames:
    - RoleOwner
    - RoleAdmin
    - RoleEmployee
  model.Room:
    properties:
      closedDates:
        description: YYYY-MM-DD format
        items:
          type: string
        type: array
      elements:
        items:
          $ref: '#/definitions/model.Element'
        type: array
      id:
        type: string
      isEnabled:
        type: boolean
      name:
        type: string
      regularSchedule:
        $ref: '#/definitions/model.WeekSchedule'
      specialDateSchedules:
        items:
          $ref: '#/definitions/model.SpecialDateSchedule'
        type: array
    type: object
  model.SaveElementsRequest:
    properties:
      elements:
        items:
          $ref: '#/definitions/model.Element'
        type: array
    required:
    - elements
    type: object
  model.Settings:
    properties:
      autoReservationAccepting:
        type: boolean
      defaultReservationDuration:
        description: minutes
        type: integer
      maxDaysInAdvance:
        type: integer
      maxGuestsPerReservation:
        description: Legacy fields for backward compatibility (these will be deprecated)
        type: integer
      maxReservationDuration:
        description: HH:MM format
        type: string
      minReservationDuration:
        description: HH:MM format
        type: string
      reservationIntervalMinutes:
        type: integer
      reservationReminderMinutes:
        type: integer
    type: object
  model.SpecialDateSchedule:
    properties:
      dates:
        description: YYYY-MM-DD format
        items:
          type: string
        type: array
      id:
        type: string
      isActive:
        type: boolean
      name:
        description: e.g., "New Year Special Hours"
        type: string
      timeRanges:
        items:
          $ref: '#/definitions/model.TimeRange'
        type: array
    type: object
  model.Status:
    enum:
    - BOOKING
    - PENDING
    - CONFIRMED
    - ARRIVED
    - COMPLETED
    - NO_SHOW
    - CANCELED_BY_CLIENT
    - CANCELED_BY_ADMIN
    type: string
    x-enum-varnames:
    - StatusBooking
    - StatusPending
    - StatusConfirmed
    - StatusArrived
    - StatusCompleted
    - StatusNoShow
    - StatusCanceledByClient
    - StatusCanceledByAdmin
  model.SubURL:
    properties:
      id:
        type: string
      key:
        type: string
      name:
        type: string
    type: object
  model.TelegramAuthResponse:
    properties:
      authRequestId:
        type: string
      tgUrl:
        type: string
    type: object
  model.TelegramConnectionResponse:
    properties:
      connectionRequestId:
        type: string
      tgUrl:
        type: string
    type: object
  model.TelegramConnectionVerifyResponse:
    properties:
      isPending:
        type: boolean
      success:
        type: boolean
    type: object
  model.TimeRange:
    properties:
      endTime:
        description: HH:MM format
        type: string
      startTime:
        description: HH:MM format
        type: string
    type: object
  model.UpdateElementRequest:
    properties:
      code:
        $ref: '#/definitions/model.ElementCode'
      font_size:
        type: integer
      height:
        type: integer
      index:
        type: integer
      is_enabled:
        type: boolean
      rotation:
        type: integer
      seats:
        items:
          $ref: '#/definitions/model.Element'
        type: array
      table_index:
        type: integer
      text:
        type: string
      type:
        $ref: '#/definitions/model.ElementType'
      width:
        type: integer
      x:
        type: number
      "y":
        type: number
    type: object
  model.UpdateReservationRequest:
    properties:
      adminNotes:
        type: string
      cancellationReason:
        type: string
      duration:
        type: string
      guestCount:
        maximum: 20
        minimum: 1
        type: integer
      startAt:
        type: string
      tableId:
        type: string
    type: object
  model.UpdateReservationStatusRequest:
    properties:
      adminNotes:
        type: string
      cancellationReason:
        type: string
      status:
        $ref: '#/definitions/model.Status'
    required:
    - status
    type: object
  model.UpdateRestaurantRequest:
    properties:
      address:
        maxLength: 200
        minLength: 5
        type: string
      description:
        maxLength: 500
        type: string
      isActive:
        type: boolean
      name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        type: string
    type: object
  model.UpdateRestaurantSettingsRequest:
    properties:
      autoReservationAccepting:
        type: boolean
      defaultReservationDuration:
        type: integer
      maxGuestsPerReservation:
        type: integer
    type: object
  model.UpdateRoomRequest:
    properties:
      closedDates:
        items:
          type: string
        type: array
      isEnabled:
        type: boolean
      name:
        maxLength: 100
        minLength: 1
        type: string
      regularSchedule:
        $ref: '#/definitions/model.WeekSchedule'
      specialDateSchedules:
        items:
          $ref: '#/definitions/model.SpecialDateSchedule'
        type: array
    type: object
  model.UrlNameAvailabilityResponse:
    properties:
      isAvailable:
        type: boolean
    type: object
  model.VerifyEmailRequest:
    properties:
      code:
        type: string
      codeRequestId:
        type: string
    required:
    - code
    - codeRequestId
    type: object
  model.VerifyResponse:
    properties:
      accessToken:
        type: string
    type: object
  model.WeekDaySchedule:
    properties:
      isActive:
        type: boolean
      timeRanges:
        items:
          $ref: '#/definitions/model.TimeRange'
        type: array
    type: object
  model.WeekSchedule:
    properties:
      friday:
        $ref: '#/definitions/model.WeekDaySchedule'
      monday:
        $ref: '#/definitions/model.WeekDaySchedule'
      saturday:
        $ref: '#/definitions/model.WeekDaySchedule'
      sunday:
        $ref: '#/definitions/model.WeekDaySchedule'
      thursday:
        $ref: '#/definitions/model.WeekDaySchedule'
      tuesday:
        $ref: '#/definitions/model.WeekDaySchedule'
      wednesday:
        $ref: '#/definitions/model.WeekDaySchedule'
    type: object
host: localhost:8080
info:
  contact:
    email: support@reservia.com
    name: Reservia API Support
    url: http://www.reservia.com/support
  description: A restaurant reservation management system API built with clean architecture.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Reservia API
  version: "1.0"
paths:
  /api/admin/dev/ping:
    get:
      consumes:
      - application/json
      description: Simple ping endpoint for development and health checking
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Development ping endpoint
      tags:
      - development
  /auth/login:
    post:
      consumes:
      - application/json
      description: Initiate login process with email verification
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthInitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: User login
      tags:
      - authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Initiate registration process with email verification
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthInitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: User registration
      tags:
      - authentication
  /auth/register/employee:
    get:
      consumes:
      - application/json
      description: Complete employee registration using invitation link with code_request_id
        and code
      parameters:
      - description: Code Request ID from invitation
        in: query
        name: code_request_id
        required: true
        type: string
      - description: Invitation code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.VerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Complete employee registration via invitation
      tags:
      - authentication
  /auth/tg:
    get:
      consumes:
      - application/json
      description: Initiate Telegram authorization process for admin bot
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TelegramAuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Authorize via Telegram (Admin Bot)
      tags:
      - authentication
  /auth/tg/{requestID}:
    get:
      consumes:
      - application/json
      description: Check status of Telegram authorization request from admin bot
      parameters:
      - description: Request ID
        in: path
        name: requestID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PendingAuthResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Verify Telegram authorization
      tags:
      - authentication
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verify email verification code
      parameters:
      - description: Verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.VerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Verify email code
      tags:
      - authentication
  /cities:
    get:
      consumes:
      - application/json
      description: Retrieve all available cities with their information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.CityResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Get all cities
      tags:
      - cities
  /cities/{name}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific city by its name
      parameters:
      - description: City name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CityResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
