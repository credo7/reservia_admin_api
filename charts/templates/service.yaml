apiVersion: v1
kind: Service
metadata:
  name: admin-api
  labels:
    app.kubernetes.io/name: reservia-admin-api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: reservia-admin-api